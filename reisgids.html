<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Rondreis reisgids</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --tekst:#1b2330; --zacht:#5d6877; --lijn:#dde1e7; --accent:#0b6bcb; --goed:#13803f; --fout:#b42318; --let:#b45309; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12161c; --card:#1b212a; --tekst:#e8ecf1; --zacht:#9aa5b4; --lijn:#2c3441; --accent:#5aa7f5; --goed:#4cc17b; --fout:#f97066; --let:#f5a524; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--tekst); font:16px/1.5 system-ui,sans-serif; }
  main { max-width:1040px; margin:0 auto; padding:12px 16px 60px; }
  header.top { background:var(--card); border-bottom:1px solid var(--lijn); position:sticky; top:0; z-index:5; }
  header.top .in { max-width:1040px; margin:0 auto; padding:8px 16px; }
  header.top .kop { display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:space-between; }
  header.top h1 { font-size:1.15rem; margin:0; }
  header.top select { max-width:100%; }
  nav.tabs { display:flex; flex-wrap:wrap; gap:4px; margin-top:6px; }
  nav.tabs button { padding:5px 10px; font-size:.88rem; }
  nav.tabs button.slot { opacity:.55; }
  nav.tabs button.act { background:var(--accent); border-color:var(--accent); color:#fff; }
  h2 { font-size:1.15rem; margin:0 0 6px; }
  h3 { font-size:1rem; margin:14px 0 6px; }
  p.sub, .noot { color:var(--zacht); font-size:.88rem; margin:0 0 10px; }
  .card { background:var(--card); border:1px solid var(--lijn); border-radius:10px; padding:16px; margin:14px 0; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; }
  .grid .wide { grid-column:1/-1; }
  label { display:block; font-size:.85rem; color:var(--zacht); margin-bottom:2px; }
  .hint { font-size:.78rem; color:var(--zacht); margin-top:2px; }
  input, select, textarea, button { font:inherit; color:inherit; max-width:100%; }
  input[type=text], input[type=number], input[type=date], input[type=time], input[type=url], input[type=month], select, textarea { width:100%; padding:7px 8px; border:1px solid var(--lijn); border-radius:6px; background:var(--bg); }
  .vink { display:flex; gap:8px; align-items:flex-start; }
  .vink input { margin-top:5px; }
  .vink label { color:var(--tekst); font-size:.95rem; margin:0; }
  button, a.knop { display:inline-block; padding:7px 12px; border:1px solid var(--lijn); border-radius:6px; background:var(--card); cursor:pointer; text-decoration:none; color:var(--accent); font-size:.9rem; }
  button.prim { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.gevaar { color:var(--fout); }
  button.klein { padding:3px 8px; font-size:.8rem; }
  a { color:var(--accent); }
  .rij { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:10px; }
  table { width:100%; border-collapse:collapse; font-size:.92rem; }
  th, td { text-align:left; padding:5px 6px; border-bottom:1px solid var(--lijn); vertical-align:top; }
  th { color:var(--zacht); font-weight:600; font-size:.8rem; }
  td.r, th.r { text-align:right; }
  td input, td select { padding:4px 6px; }
  tr.totaal td { font-weight:700; border-top:2px solid var(--lijn); }
  .box { background:var(--bg); border:1px solid var(--lijn); border-radius:8px; padding:10px 12px; margin-top:10px; font-size:.92rem; }
  .b { display:inline-block; padding:1px 8px; border-radius:10px; font-size:.78rem; font-weight:600; border:1px solid currentColor; white-space:nowrap; }
  .b-goed { color:var(--goed); } .b-let { color:var(--let); } .b-fout { color:var(--fout); } .b-n { color:var(--zacht); }
  .fout { color:var(--fout); } .let { color:var(--let); } .goed { color:var(--goed); }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
  .kpi { background:var(--bg); border:1px solid var(--lijn); border-radius:8px; padding:8px 10px; }
  .kpi b { display:block; font-size:1.25rem; }
  .kpi span { font-size:.78rem; color:var(--zacht); }
  details.sub { border:1px solid var(--lijn); border-radius:8px; padding:8px 12px; margin:10px 0; background:var(--card); }
  details.sub > summary { cursor:pointer; font-weight:600; }
  .item { border:1px solid var(--lijn); border-radius:8px; padding:10px; margin:8px 0; background:var(--bg); }
  .fotos { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:10px; }
  .foto { border:1px solid var(--lijn); border-radius:8px; padding:6px; background:var(--bg); }
  .foto img { width:100%; height:150px; object-fit:cover; border-radius:6px; display:block; }
  .banner { background:color-mix(in srgb, var(--let) 18%, transparent); border:1px solid var(--let); border-radius:8px; padding:8px 12px; margin:10px 0; font-size:.9rem; }
  .banner.fout { background:color-mix(in srgb, var(--fout) 14%, transparent); border-color:var(--fout); }
  #melding { position:fixed; right:12px; bottom:12px; background:var(--card); border:1px solid var(--lijn); border-radius:8px; padding:6px 12px; font-size:.85rem; box-shadow:0 2px 8px rgba(0,0,0,.2); display:none; z-index:9; max-width:90vw; }
  .tw { display:flex; flex-wrap:wrap; gap:6px 14px; }
  .tw .vink { min-width:230px; }

  /* Reisboek (altijd licht, ook in donkere modus) */
  .boek { --bg:#fff; --card:#fff; --tekst:#111; --zacht:#555; --lijn:#ccc; --accent:#0b4f9c; --goed:#0d6b32; --fout:#a31d12; --let:#8a4200;
          background:#fff; color:#111; border:1px solid var(--lijn); border-radius:6px; padding:20px; font-size:14px; line-height:1.45; }
  .boek h1 { font-size:2rem; margin:30px 0 8px; } .boek h2 { font-size:1.25rem; border-bottom:2px solid #0b4f9c; padding-bottom:3px; margin:18px 0 8px; }
  .boek h3 { margin:12px 0 4px; font-size:1rem; } .boek table { font-size:.88rem; }
  .boek td, .boek th { overflow-wrap:break-word; } .boek th { white-space:nowrap; } .boek td.r { white-space:nowrap; }
  .boek .voorblad { text-align:center; padding:50px 10px 30px; }
  .boek .meta { color:#444; font-size:.88rem; margin-bottom:6px; }
  .boek figure { margin:0; break-inside:avoid; } .boek figure img { width:100%; max-height:75mm; object-fit:contain; background:#f3f3f3; }
  .boek figcaption { font-size:.8rem; color:#444; }
  .boek .fg { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .boek .bdag { margin-top:26px; padding-top:6px; border-top:3px solid #0b4f9c; }
  .boek .vak { border:1px solid #bbb; border-radius:4px; padding:6px 10px; margin:6px 0; break-inside:avoid; }
  .boek .lijnen { height:60px; background:repeating-linear-gradient(#fff 0 19px,#bbb 19px 20px); }
  .boek .bron { font-size:.78rem; color:#555; }
  #printBlad { display:none; }
  .pv { white-space:pre-wrap; border-bottom:1px dotted #999; display:inline-block; min-width:2ch; }
  .boek.deelprint > [data-sec]:not(.kies) { display:none !important; }
  @page { size:A4; margin:14mm 12mm; }
  @media print {
    body { background:#fff; color:#000; }
    header.top, .noprint, #melding, .banner.noprint { display:none !important; }
    body.print-blad main { display:none !important; }
    body.print-blad #printBlad { display:block; }
    #printBlad .card { border:0; padding:0; margin:8px 0; }
    #printBlad .grid { grid-template-columns:repeat(2,1fr); }
    #printBlad h2 { break-after:avoid; }
    main { padding:0; max-width:none; }
    .boek { border:0; padding:0; border-radius:0; font-size:11pt; }
    .boek .bdag, .boek .bsec { break-before:page; }
    .boek .bdag { border-top:0; margin-top:0; }
    .boek tr, .boek .vak, .boek figure { break-inside:avoid; }
    .boek a { color:#0b4f9c; }
  }
  td, th, .noot, .box, p, li, label, summary, .kpi { overflow-wrap:anywhere; }
  @media (max-width:640px) {
    .boek table { display:block; overflow-x:auto; }
    table.rtab thead { display:none; }
    table.rtab tr { display:block; border:1px solid var(--lijn); border-radius:8px; margin-bottom:8px; padding:6px; }
    table.rtab td { display:flex; justify-content:space-between; gap:8px; border:0; padding:3px 0; }
    table.rtab td::before { content:attr(data-l); color:var(--zacht); font-size:.78rem; flex:0 0 38%; }
    table.rtab td > * { flex:1 1 auto; min-width:0; }
    .boek .fg { grid-template-columns:1fr; }
  }
</style>
</head>

    ${fld(p + '.bScore', 'Booking.com: gemiddelde (van 10)', 'n')}${fld(p + '.bN', 'Booking.com: aantal reviews', 'n', { min: 0 })}${fld(p + '.bNeg', 'Booking.com: negatief (volgens definitie)', 'n', { min: 0 })}${fld(p + '.bLink', 'Booking.com-link', 'u')}${fld(p + '.revDatum', 'Reviews gezien op', 'd')}

function hotelBrief(t, i) {
  const h = t.hotels.lijst[i], c = t.hotels.crit, jn = v => eis(v) ? 'ja' : 'nee';
  return [`Zoek 3 hotels in ${h.plaats}`, `Aankomst ${h.van}, vertrek ${h.tot} (${nachten(h)} nachten), ${persVoor(t, 'Verblijf')} reizigers, ${h.kamers || 1} kamer(s)`,
    `Zoek alleen bij Agoda.com, Booking.com en op de officiële website van het hotel zelf, en neem de laagste prijs voor dezelfde voorwaarden (annuleren, ontbijt).`,
    `Maximumprijs ${c.maxPrijs} ${t.reis.valuta} per kamer per nacht, alles inbegrepen (ontbijt, parkeren, belasting). Een duurder hotel (tot ${c.maxUitz}) alleen als ik dat eerst bevestig.`,
    `Waardering: Booking minimaal ${c.minBooking}, Google minimaal ${c.minGoogle}; minimaal ${c.minReviews} reviews per bron en maximaal ${c.maxNegPct}% negatieve reviews`,
    `Ontbijt: ${jn(c.ontbijt)} · Parkeren: ${jn(c.parkeren)} · Wifi: ${jn(c.wifi)} · Eigen badkamer: ${jn(c.badkamer)} · Goede wijk: ${jn(c.wijk)} (veiligheid is altijd een eis)`,
    num(c.maxAfstand) != null ? `Maximaal ${c.maxAfstand} km van het centrum` : null, c.ligging ? `Ligging: ${c.ligging}` : null,
    'Geef per hotel: adres, prijs per nacht per bron (Booking.com, Agoda.com, hotelwebsite; alles inbegrepen), Booking- en Google-score met aantal reviews en % negatief, ontbijt, parkeren, wifi, badkamer, wijk/veiligheid, afstand tot het centrum en een link.'].filter(Boolean).join('\n');
}

function kaartSVG(t) {
  const P = []; t.dagen.forEach(d => { if (d.geo && isFinite(d.geo.lat)) { const l = P[P.length - 1], naam = d.plaats || d.geo.naam; if (!l || l.naam !== naam) P.push({ naam, lat: d.geo.lat, lon: d.geo.lon, nr: String(P.length + 1) }); } });
  return kaartTeken(P, 'Nog geen kaart: zoek de locaties op met “Locaties en tijdzones opzoeken”.');
}
function kaartTeken(P, leeg) {
  if (P.length < 2) return `<p class="noot">${leeg}</p>`;
  const lat0 = sum(P.map(p => p.lat)) / P.length, kx = Math.cos(lat0 * Math.PI / 180);
  const X = P.map(p => p.lon * kx), Y = P.map(p => -p.lat);
  const minX = Math.min(...X), maxX = Math.max(...X), minY = Math.min(...Y), maxY = Math.max(...Y);
  const W = 640, H = 340, m = 40, sc = Math.min((W - 2 * m) / ((maxX - minX) || 1), (H - 2 * m) / ((maxY - minY) || 1));
  const px = i => m + (X[i] - minX) * sc + ((W - 2 * m) - (maxX - minX) * sc) / 2, py = i => m + (Y[i] - minY) * sc + ((H - 2 * m) - (maxY - minY) * sc) / 2;
  /* dezelfde plaats die vaker voorkomt (bijv. begin en eind) krijgt één marker met meerdere nummers */
  const U = []; P.forEach((p, i) => { const g = U.find(u => u.naam === p.naam); if (g) g.nrs.push(p.nr); else U.push({ naam: p.naam, i, nrs: [p.nr] }); });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Schematische routekaart" style="width:100%;max-width:700px;background:#f4f6f8;border:1px solid #ccc;border-radius:6px"><polyline fill="none" stroke="#0b4f9c" stroke-width="2" stroke-dasharray="5 3" points="${P.map((_, i) => px(i).toFixed(1) + ',' + py(i).toFixed(1)).join(' ')}"/>${U.map(u => { const l = u.nrs.join(','), r = 8 + 3 * l.length; return `<circle cx="${px(u.i).toFixed(1)}" cy="${py(u.i).toFixed(1)}" r="${r}" fill="#0b4f9c"/><text x="${px(u.i).toFixed(1)}" y="${(py(u.i) + 4).toFixed(1)}" text-anchor="middle" font-size="11" fill="#fff" font-family="sans-serif">${esc(l)}</text><text x="${(px(u.i) + r + 4).toFixed(1)}" y="${(py(u.i) + 4).toFixed(1)}" font-size="12" fill="#111" font-family="sans-serif">${esc(u.naam)}</text>`; }).join('')}</svg>`;
}

  let od = start, ot = '', id = eind, it = '';

  const volg = (key, nieuw, vorig) => { if (nieuw && (!au[key] || au[key] === vorig)) au[key] = nieuw; };

  const tv = v.terugVan || v.naar;
  volg('ophaalPlaats', v.naar, p.naar); volg('inleverPlaats', tv, p.terugVan);
  t.sync = { start: start || p.start, eind: eind || p.eind, naar: v.naar || p.naar, terugVan: tv || p.terugVan, od: od || p.od, ot: ot || p.ot, id: id || p.id, it: it || p.it };
}
