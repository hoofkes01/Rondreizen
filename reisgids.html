const VIEWS = {};

VIEWS.start = () => {
  const t = T();
  let h = `<section class="card"><h2>Welkom</h2><p class="noot">Plan een rondreis, gebruik de gids onderweg, houd een dagboek met foto’s bij en bewaar alles als printbaar reisboek. Alle gegevens staan alleen in deze browser (niet in de openbare repo). Maak regelmatig een back-up op het tabblad Gegevens.</p>
    <div class="rij"><button class="prim" data-a="nieuw">+ Nieuwe reis</button><button data-a="demo">Demo-reis laden (verzonnen gegevens)</button><label class="knop" style="margin:0">Back-up inlezen<input type="file" accept="application/json,.json" data-ch="importeer" hidden></label></div></section>`;
  if (!t) return h + `<p class="noot">Er is nog geen reis. Maak een nieuwe reis aan om te beginnen.</p>`;
  const S = voortgang(t), W = waarschuwingen(t), d = duurDagen(t);
  const R = kostenRegels(t), ks = kostenSom(R);
  h += `<section class="card"><h2>${esc(t.naam)} ${t.demo ? badge('l', 'DEMO – verzonnen gegevens') : ''}</h2>
    <div class="kpis">
      <div class="kpi"><b>${d ?? '—'}</b><span>dagen${okD(t.reis.vertrek) ? ` (${dFmt(t.reis.vertrek)} – ${dFmt(t.reis.terug)})` : ''}</span></div>
      <div class="kpi"><b>${personen(t)}</b><span>reizigers (${t.reis.volw} volw., ${t.reis.kind} kind.)</span></div>
      <div class="kpi"><b>${NF.format(totaalKm(t))} km</b><span>geplande route${t.reis.toonMijl ? kmMi(totaalKm(t)) : ''}</span></div>
      <div class="kpi"><b>${mny(ks.bekend)}</b><span>bekende kosten${ks.onb ? ` (+ ${ks.onb} onbekend)` : ''}</span></div>
      <div class="kpi"><b>${num(t.reis.budget) != null ? mny(t.reis.budget) : '—'}</b><span>budget</span></div>
    </div></section>`;
  h += `<section class="card"><h2>Voortgang intake</h2><table class="rtab"><thead><tr><th>Onderdeel</th><th>Ingevuld</th><th>Nog te doen</th><th></th></tr></thead><tbody>` +
    S.map(s => { const tabNaam = { Reis: 'reis', Vlucht: 'vlucht', Auto: 'auto', Verblijf: 'verblijf', Reisgids: 'gids' }[s.naam]; return `<tr><td data-l="Onderdeel"><b>${s.naam}</b></td><td data-l="Ingevuld">${s.klaar}/${s.totaal} ${badge(s.ontbreekt.length ? 'l' : 'g', s.ontbreekt.length ? 'onvolledig' : 'compleet')}</td><td data-l="Nog te doen" class="noot">${s.ontbreekt.length ? 'Ontbreekt: ' + s.ontbreekt.map(esc).join(', ') + '. Dit onderdeel is daardoor minder nauwkeurig.' : '—'}</td><td><button class="klein" data-a="tab" data-t="${tabNaam}">Open</button></td></tr>`; }).join('') + `</tbody></table></section>`;
  h += `<section class="card"><h2>Aandachtspunten</h2>${W.length ? W.map(([k, m]) => `<div class="banner ${k === 'fout' ? 'fout' : ''}">${esc(m)}</div>`).join('') : '<p class="noot">Geen aandachtspunten gevonden op basis van de ingevulde gegevens. Dat is geen garantie: controleer weer, wegen en officiële waarschuwingen zelf.</p>'}</section>`;
  h += `<section class="card"><h2>Vandaag onderweg?</h2><p class="noot">Open de dagpagina van de huidige reisdag met lokale tijd, route, programma, weer en afvinklijst.</p><div class="rij"><button class="prim" data-a="vandaag">Naar dagpagina van vandaag</button></div></section>`;
  return h;
};

function kaartSVG(t) {
  const P = []; t.dagen.forEach((d, i) => { if (d.geo && isFinite(d.geo.lat)) { const l = P[P.length - 1]; if (!l || l.naam !== (d.plaats || d.geo.naam)) P.push({ naam: d.plaats || d.geo.naam, lat: d.geo.lat, lon: d.geo.lon, n: i + 1 }); } });
  if (P.length < 2) return '<p class="noot">Nog geen kaart: zoek de locaties op met “Locaties en tijdzones opzoeken”.</p>';
  const lat0 = sum(P.map(p => p.lat)) / P.length, kx = Math.cos(lat0 * Math.PI / 180);
  const X = P.map(p => p.lon * kx), Y = P.map(p => -p.lat);
  const minX = Math.min(...X), maxX = Math.max(...X), minY = Math.min(...Y), maxY = Math.max(...Y);
  const W = 640, H = 340, m = 40, sc = Math.min((W - 2 * m) / ((maxX - minX) || 1), (H - 2 * m) / ((maxY - minY) || 1));
  const px = i => m + (X[i] - minX) * sc + ((W - 2 * m) - (maxX - minX) * sc) / 2, py = i => m + (Y[i] - minY) * sc + ((H - 2 * m) - (maxY - minY) * sc) / 2;
  /* dezelfde plaats die vaker voorkomt (bijv. begin en eind) krijgt één marker met meerdere nummers */
  const U = []; P.forEach((p, i) => { const g = U.find(u => u.naam === p.naam); if (g) g.nrs.push(i + 1); else U.push({ naam: p.naam, i, nrs: [i + 1] }); });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Schematische routekaart" style="width:100%;max-width:700px;background:#f4f6f8;border:1px solid #ccc;border-radius:6px"><polyline fill="none" stroke="#0b4f9c" stroke-width="2" stroke-dasharray="5 3" points="${P.map((_, i) => px(i).toFixed(1) + ',' + py(i).toFixed(1)).join(' ')}"/>${U.map(u => { const l = u.nrs.join(','), r = 8 + 3 * l.length; return `<circle cx="${px(u.i).toFixed(1)}" cy="${py(u.i).toFixed(1)}" r="${r}" fill="#0b4f9c"/><text x="${px(u.i).toFixed(1)}" y="${(py(u.i) + 4).toFixed(1)}" text-anchor="middle" font-size="11" fill="#fff" font-family="sans-serif">${l}</text><text x="${(px(u.i) + r + 4).toFixed(1)}" y="${(py(u.i) + 4).toFixed(1)}" font-size="12" fill="#111" font-family="sans-serif">${esc(u.naam)}</text>`; }).join('')}</svg>`;
}

VIEWS.kosten = () => {

  const onderdelen = ['Vlucht', 'Auto', 'Verblijf', 'Reisgids', 'Overig'];

    `<div class="kpis"><div class="kpi"><b>${mny(ks.bekend)}</b><span>bekend totaal (hele groep)</span></div><div class="kpi"><b>${pers ? mny(ks.bekend / pers) : '—'}</b><span>per persoon (${pers} pers.)</span></div><div class="kpi"><b>${bud != null ? mny(bud - ks.bekend) : '—'}</b><span>${bud != null ? (bud - ks.bekend >= 0 ? 'ruimte onder budget' : 'OVER budget') : 'geen budget ingevuld'}</span></div><div class="kpi"><b>${ks.onb}</b><span>onbekende posten</span></div></div>
    ${ks.onb ? `<div class="banner">Het totaal is een ondergrens: ${ks.onb} post(en) zijn nog niet ingevuld.</div>` : ''}
    <div class="grid" style="margin-top:10px">${fld('buffer', 'Buffer onvoorziene kosten (% over bekende bedragen)', 'n', { min: 0 })}</div>`);
  h += `<section class="card"><table class="rtab"><thead><tr><th>Onderdeel / post</th><th class="r">Bedrag</th><th class="r">p.p.</th><th>Status</th><th>Bron / datum</th><th class="r">Werkelijk</th></tr></thead><tbody>`;
  onderdelen.forEach(o => {
    const L = R.filter(x => x.o === o); if (!L.length) return;

    h += `<tr><td colspan="6" style="background:var(--bg)"><b>${o}</b> – subtotaal ${mny(s.bekend)} · per persoon ${pp ? mny(s.bekend / pp) : '—'} (${pp} pers.)${s.onb ? ` · ${s.onb} onbekend` : ''}</td></tr>`;
    L.forEach(x => { const w = num(t.werkelijk[x.key]); h += `<tr><td data-l="Post">${esc(x.post)}${x.opm ? `<div class="noot">${esc(x.opm)}</div>` : ''}</td><td class="r" data-l="Bedrag">${x.b == null ? '<span class="let">nog in te vullen</span>' : mny(x.b)}${x.onb ? `<div class="noot">+ ${x.onb} onbekend</div>` : ''}</td><td class="r" data-l="p.p.">${x.b == null ? '—' : mny(x.b / pp)}</td><td data-l="Status">${badge(x.type === 'gecontroleerd' ? 'g' : x.type === 'gemengd' ? 'n' : 'l', PTL[x.type] || x.type)}</td><td class="noot" data-l="Bron">${esc(x.bron)} ${x.datum ? '· ' + dFmt(x.datum) : ''}</td><td class="r" data-l="Werkelijk"><input type="number" style="width:100px" data-wk="${esc(x.key)}" value="${w ?? ''}"></td></tr>`; });
  });
  const wkSom = sum(Object.values(t.werkelijk).map(num).filter(x => x != null));
  h += `<tr class="totaal"><td>Totaal (bekend, excl. borg)</td><td class="r">${mny(ks.bekend)}</td><td class="r">${pers ? mny(ks.bekend / pers) : '—'}</td><td></td><td></td><td class="r">${Object.keys(t.werkelijk).length ? mny(wkSom) : '—'}</td></tr></tbody></table>
    <p class="noot">Niet in het totaal: borg${num(t.auto.borg) != null ? ` (${mny(t.auto.borg)}, wordt teruggestort)` : ''}, persoonlijke uitgaven, fooien en kosten die u niet hebt ingevuld. Prijspeil: de datum per post; prijsstijging is niet aangenomen. Valuta: ${esc(t.reis.valuta)}${t.valutaLokaal.code && t.valutaLokaal.koers ? `; lokale posten omgerekend met koers ${t.valutaLokaal.koers} ${esc(t.valutaLokaal.code)} per ${esc(t.reis.valuta)} (${dFmt(t.valutaLokaal.datum)})` : ''}.</p></section>`;
  h += `<section class="card"><h2>Extra kostenposten</h2><table class="rtab"><thead><tr><th>Post</th><th>Bedrag</th><th>Soort</th><th>Bron</th><th>Datum</th><th></th></tr></thead><tbody>` + t.extra.map((e, i) => `<tr><td data-l="Post"><input type="text" data-b="extra.${i}.post" value="${esc(e.post)}"></td><td data-l="Bedrag"><input type="number" min="0" data-b="extra.${i}.bedrag" value="${esc(e.bedrag)}" style="width:100px"></td><td data-l="Soort"><select data-b="extra.${i}.type">${PRIJSTYPE.map(([k, x]) => `<option value="${k}" ${e.type === k ? 'selected' : ''}>${x}</option>`).join('')}</select></td><td data-l="Bron"><input type="text" data-b="extra.${i}.bron" value="${esc(e.bron)}"></td><td data-l="Datum"><input type="date" data-b="extra.${i}.datum" value="${esc(e.datum)}"></td><td><button class="klein gevaar" data-a="del" data-p="extra" data-i="${i}">✕</button></td></tr>`).join('') + `</tbody></table><div class="rij"><button data-a="add" data-p="extra" data-n="extra">+ Post</button></div></section>`;
  h += `<section class="card"><h2>Kosten per dag (reisgids)</h2><table class="rtab"><thead><tr><th>Dag</th><th>Plaats</th><th class="r">Activiteiten</th><th class="r">Eten</th><th class="r">Overig</th><th class="r">Dagtotaal</th></tr></thead><tbody>` + t.dagen.map((d, i) => { const b = dagBudget(t, d); return `<tr><td data-l="Dag">${i + 1} (${dFmt(d.datum)})</td><td data-l="Plaats">${esc(d.plaats)}</td><td class="r" data-l="Act.">${b.act == null ? '—' : mny(b.act)}${b.onb ? ` <span class="let">+${b.onb} onbekend</span>` : ''}</td><td class="r" data-l="Eten">${b.eten == null ? '—' : mny(b.eten)}</td><td class="r" data-l="Overig">${b.ov == null ? '—' : mny(b.ov)}</td><td class="r" data-l="Dagtotaal"><b>${mny(b.tot)}</b></td></tr>`; }).join('') + `</tbody></table></section>`;
  return h;
};
function dagBudget(t, d) {
  const pers = personen(t); let act = 0, an = 0, onb = 0;
  d.programma.forEach(it => { if (it.soort === 'eten' || it.soort === 'pauze') return; const b = itemKosten(t, it); if (b == null) onb++; else { act += b; an++; } });
  const l = num(d.lunchPp), di = num(d.dinerPp), eten = (l == null && di == null) ? null : ((l || 0) + (di || 0)) * pers, ov = num(d.overig);
  return { act: an ? act : null, onb, eten, ov, tot: (an ? act : 0) + (eten || 0) + (ov || 0) };
}

    <div class="tw">${fld('boek.dagboek', 'Dagboek en werkelijk verloop opnemen', 'c', { r: 1 })}${fld('boek.foto', 'Foto’s opnemen', 'c', { r: 1 })}${fld('boek.refs', 'Boekings- en polisnummers opnemen', 'c', { r: 1, h: 'Staan dan op papier; bewaar het reisboek veilig.' })}${fld('boek.bronnen', 'Bronnen en peildata vermelden', 'c', { r: 1 })}</div>
    <div class="rij"><button class="prim" data-a="print">Afdrukken / opslaan als PDF</button><button data-a="boekHTML">Download als één HTML-bestand (met foto’s)</button></div></section><div id="boekUit" class="boek"><p class="noot">Reisboek wordt samengesteld…</p></div>`;
};
async function bouwBoek(dataUrls) {
  const t = T(), uit = $('#boekUit'); if (!t) return ''; const o = t.boek;
  const ids = o.foto && o.dagboek ? t.dagen.flatMap(d => d.dagboek.fotos.map(f => f.id)) : [];
  const src = {};
  for (const id of ids) { try { src[id] = dataUrls ? await blobNaarData(await fotoGet(id)) : await fotoUrl(id); } catch { src[id] = ''; } }
  const html = reisboekHTML(t, src);
  if (uit && !dataUrls) { uit.innerHTML = html; await Promise.all($$('img', uit).map(im => im.decode ? im.decode().catch(() => { }) : 0)); }
  return html;
}
function reisboekHTML(t, src) {
  const o = t.boek, r = t.reis, R = kostenRegels(t), ks = kostenSom(R), pers = personen(t), nu = new Date();
  const nachtenTot = t.dagen.length ? t.dagen.filter(d => d.type !== 'vertrek').length : null;
  const plaatsen = [...new Set(t.dagen.map(d => d.plaats).filter(Boolean))];
  const tbl = (kop, rijen, kl = []) => `<table><thead><tr>${kop.map((k, i) => `<th class="${kl[i] || ''}">${k}</th>`).join('')}</tr></thead><tbody>${rijen.map(rw => `<tr>${rw.map((c, i) => `<td class="${kl[i] || ''}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  const ref = x => o.refs && x ? esc(x) : (x ? '<i>(niet opgenomen)</i>' : '—');
