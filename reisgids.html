<title>Rondreis reisgids</title>
<style>

          background:#fff; color:#111; border:1px solid var(--lijn); border-radius:6px; padding:20px; font-size:14px; line-height:1.45; }

    .boek .fg { grid-template-columns:1fr; }

/* Booking.com-zoeklink, vooringevuld. De parameters (ss, checkin, checkout, group_adults, no_rooms, selected_currency en nflt met review_score, fc=2 gratis annuleren,
   price, mealplan=1 ontbijt, hotelfacility=107 gratis wifi) zijn op 24-10-2026 gecontroleerd op de echte site; parkeren (hotelfacility=2) is niet gecontroleerd en zit er niet in. */
function bookingLink(t, h) {
  const c = t.hotels.crit, mb = num(c.minBooking), rs = mb == null ? null : mb >= 9 ? 90 : mb >= 8 ? 80 : mb >= 7 ? 70 : mb >= 6 ? 60 : null, cur = t.reis.valuta || 'EUR', f = [];
  if (rs) f.push('review_score=' + rs); f.push('fc=2');
  if (num(c.maxPrijs) != null) f.push(`price=${cur}-min-${Math.round(num(c.maxPrijs))}-1`);
  if (eis(c.ontbijt)) f.push('mealplan=1'); if (eis(c.wifi)) f.push('hotelfacility=107');
  const q = new URLSearchParams({ ss: [h.plaats, t.reis.landen].filter(Boolean).join(', '), checkin: h.van, checkout: h.tot, group_adults: String(t.reis.volw || 2), group_children: String(t.reis.kind || 0), no_rooms: String(h.kamers || c.kamers || 1), selected_currency: cur });
  return 'https://www.booking.com/searchresults.html?' + q.toString() + '&nflt=' + encodeURIComponent(f.join(';'));
}
function hotelBrief(t, i) {
  const h = t.hotels.lijst[i], c = t.hotels.crit, jn = v => eis(v) ? 'ja' : 'nee';
  return [`Zoek 3 hotels in ${h.plaats}`, `Aankomst ${h.van}, vertrek ${h.tot} (${nachten(h)} nachten), ${persVoor(t, 'Verblijf')} reizigers, ${h.kamers || 1} kamer(s)`,
    `Zoek alleen bij Agoda.com, Booking.com en op de officiële website van het hotel zelf, en neem de laagste prijs voor dezelfde voorwaarden (annuleren, ontbijt).`,
    `Alleen hotels met gratis annuleren (tarief dat later gratis te annuleren is), met de uiterste annuleerdatum erbij, zodat ik later opnieuw kan zoeken naar goedkoper of beter.`,
    `Maximumprijs ${c.maxPrijs} ${t.reis.valuta} per kamer per nacht, alles inbegrepen (ontbijt, parkeren, belasting). Een duurder hotel (tot ${c.maxUitz}) alleen als ik dat eerst bevestig.`,
    `Waardering: Booking minimaal ${c.minBooking}, Google minimaal ${c.minGoogle}; minimaal ${c.minReviews} reviews per bron en maximaal ${c.maxNegPct}% negatieve reviews`,
    `Ontbijt: ${jn(c.ontbijt)} · Parkeren: ${jn(c.parkeren)} · Wifi: ${jn(c.wifi)} · Eigen badkamer: ${jn(c.badkamer)} · Goede wijk: ${jn(c.wijk)} (veiligheid is altijd een eis)`,
    num(c.maxAfstand) != null ? `Maximaal ${c.maxAfstand} km van het centrum` : null, c.ligging ? `Ligging: ${c.ligging}` : null,
    'Geef per hotel: adres, prijs per nacht per bron (Booking.com, Agoda.com, hotelwebsite; alles inbegrepen), Booking- en Google-score met aantal reviews en % negatief, ontbijt, parkeren, wifi, badkamer, wijk/veiligheid, afstand tot het centrum en een link.'].filter(Boolean).join('\n');
}

function kaartSVG(t) {
  const P = []; t.dagen.forEach(d => { if (d.geo && isFinite(d.geo.lat)) { const l = P[P.length - 1], naam = d.plaats || d.geo.naam; if (!l || l.naam !== naam) P.push({ naam, lat: d.geo.lat, lon: d.geo.lon, nr: String(P.length + 1) }); } });
  return kaartTeken(P, 'Nog geen kaart: zoek de locaties op met “Locaties en tijdzones opzoeken”.');
}
function kaartTeken(P, leeg) {
  if (P.length < 2) return `<p class="noot">${leeg}</p>`;
  const lat0 = sum(P.map(p => p.lat)) / P.length, kx = Math.cos(lat0 * Math.PI / 180);
  const X = P.map(p => p.lon * kx), Y = P.map(p => -p.lat);
  const minX = Math.min(...X), maxX = Math.max(...X), minY = Math.min(...Y), maxY = Math.max(...Y);
  const W = 640, H = 340, m = 40, sc = Math.min((W - 2 * m) / ((maxX - minX) || 1), (H - 2 * m) / ((maxY - minY) || 1));
  const px = i => m + (X[i] - minX) * sc + ((W - 2 * m) - (maxX - minX) * sc) / 2, py = i => m + (Y[i] - minY) * sc + ((H - 2 * m) - (maxY - minY) * sc) / 2;
  /* dezelfde plaats die vaker voorkomt (bijv. begin en eind) krijgt één marker met meerdere nummers */
  const U = []; P.forEach((p, i) => { const g = U.find(u => u.naam === p.naam); if (g) g.nrs.push(p.nr); else U.push({ naam: p.naam, i, nrs: [p.nr] }); });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Schematische routekaart" style="width:100%;max-width:700px;background:#f4f6f8;border:1px solid #ccc;border-radius:6px"><polyline fill="none" stroke="#0b4f9c" stroke-width="2" stroke-dasharray="5 3" points="${P.map((_, i) => px(i).toFixed(1) + ',' + py(i).toFixed(1)).join(' ')}"/>${U.map(u => { const l = u.nrs.join(','), r = 8 + 3 * l.length; return `<circle cx="${px(u.i).toFixed(1)}" cy="${py(u.i).toFixed(1)}" r="${r}" fill="#0b4f9c"/><text x="${px(u.i).toFixed(1)}" y="${(py(u.i) + 4).toFixed(1)}" text-anchor="middle" font-size="11" fill="#fff" font-family="sans-serif">${esc(l)}</text><text x="${(px(u.i) + r + 4).toFixed(1)}" y="${(py(u.i) + 4).toFixed(1)}" font-size="12" fill="#111" font-family="sans-serif">${esc(u.naam)}</text>`; }).join('')}</svg>`;
}

  return h;

function dagBudget(t, d) {
  const pers = personen(t); let act = 0, an = 0, onb = 0;
  d.programma.forEach(it => { if (it.soort === 'eten' || it.soort === 'pauze') return; const b = itemKosten(t, it); if (b == null) onb++; else { act += b; an++; } });
  const l = num(d.lunchPp), di = num(d.dinerPp), eten = (l == null && di == null) ? null : ((l || 0) + (di || 0)) * pers, ov = num(d.overig);
  return { act: an ? act : null, onb, eten, ov, tot: (an ? act : 0) + (eten || 0) + (ov || 0) };
}

function leesBedrag(x) {
  x = x.replace(/\s/g, '').replace(/[.,]$/, ''); const p = x.lastIndexOf('.'), k = x.lastIndexOf(',');
  if (p >= 0 && k >= 0) x = p > k ? x.replace(/,/g, '') : x.replace(/\./g, '').replace(',', '.');
  else if (k >= 0) x = /,\d{3}$/.test(x) ? x.replace(/,/g, '') : x.replace(',', '.');
  else if (p >= 0 && /\.\d{3}$/.test(x)) x = x.replace(/\./g, '');
  const n = parseFloat(x); return isNaN(n) ? null : Math.round(n);
}
const plakGetal = (m, i = 1) => m ? leesBedrag(m[i]) : null;
function plakDatums(tekst, ref, nota) {
  const jr = (ref && /^\d{4}/.test(ref)) ? +ref.slice(0, 4) : null, pad = n => String(n).padStart(2, '0'), dat = [];
  const ymd = (y, m, d) => (m >= 1 && m <= 12 && d >= 1 && d <= 31) ? `${y}-${pad(m)}-${pad(d)}` : null, voeg = (idx, d) => { if (d) dat.push([idx, d]); };
